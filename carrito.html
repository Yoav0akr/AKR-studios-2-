<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Yoav Vera Aguilar 5g </title>
    <link rel="icon" type="image/png" href="./AKR_clothesshop.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/main.css">

</head>

<body>
    <div class="wrapper">
        <aside>
            <header>
                <div class="queso">
                    <img src="./AKR_clothesshop-lts.png">
                    <h1 class="logo">AKR Shop </h1>
                </div>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-carrito" href="./index.html"><i
                                class="bi bi-arrow-return-left"></i>seguir comprando</a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="./carrito.html"><i
                                class="bi bi-cart-fill"></i>Carrito</a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">
                    &copy; 2025 "AKR studios"
                </p>
            </footer>

        </aside>
        <main>
            <h2 class="titulo-principal">Carrito</h2>
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio">no as agegado nada, tu carrito esta vacio! <i
                        class="bi bi-emoji-frown"></i>
                </p>

                <div id="carrito-productos" class="carrito-productos disabled">
                    <!--esto se llena con el js-->
                </div>

                <div id="carrito-acciones" class="carrito-acciones disabled">

                    <div class="carrito-acciones-iz">
                        <button id="carrito-vaciar" class="carrito-acciones-vaciar">vaciar carrito</button>
                    </div>

                    <div class="carrito-acciones-de">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total" class="total">$3000</p>
                        </div>
                        <button id="boton-comprar" class="carrito-acciones-comprar">COMPRAR AHORA</button>
                    </div>
               
                </div>
                     <p id="carrito-accion-comprado" class="carrito-comprado disabled">Muchas graciaspor tu compra <i
                            class="bi bi-emoji-laughing"></i>
                    </p>
        </main>
    </div>




    <script src="./js/carrito.js"></script>
</body>

</html>
